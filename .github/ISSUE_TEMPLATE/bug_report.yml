name: Bug report
description: Something doesn't work, shows a wrong value or looks broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Open the panel
        2. Click Open Monitor
        3. …
  - type: input
    id: version
    attributes:
      label: mystat version
      description: In Finder, select mystat in Applications and choose File → Get Info.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Model and chip, from Apple menu → About This Mac.
      placeholder: "MacBook Pro, M4 Pro"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Turkish
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Docker Desktop or not, Full Disk Access granted or not, or anything that seems related.
